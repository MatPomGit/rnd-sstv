name: Mobile acoustic modem tests
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'tests/mobile.test.mjs', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'tests/mobile.test.mjs', '.github/workflows/mobile.yml']
jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mobile.test.mjs
      - run: node --check mobile/codec.mjs
      - run: node --check mobile/app.mjs
      - run: node --check mobile/mic-worklet.js
